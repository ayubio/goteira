name: goteira
base: core22
version: '0.4.0'
license: GPL-3.0
summary: Connectivity tester and network diagnostics tool
description: |
  Goteira tests network connectivity using ICMP ping (59 seconds per run) and
  optionally mtr, saving timestamped traceroute reports.

title: Goteira
website: https://github.com/ayubio/goteira
source-code: https://github.com/ayubio/goteira
issues: https://github.com/ayubio/goteira/issues
contact: https://github.com/ayubio/goteira/issues

grade: stable
confinement: strict

parts:
  goteira:
    plugin: rust
    source: .
    rust-channel: stable
    stage-packages:
      - iputils-ping
      - mtr-tiny

apps:
  goteira:
    command: bin/goteira
    plugs:
      - network
      - network-bind
      - network-observe
