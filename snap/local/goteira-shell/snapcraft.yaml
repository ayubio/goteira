name: goteira-shell
base: core22
version: '0.3.1'
license: GPL-3.0
summary: DEPRECATED - use the 'goteira' snap instead
description: |
  Goteira is a tool to test network connectivity using ping and optionally mtr (traceroute).
  DEPRECATED: this shell script version is no longer maintained and will not
  receive updates. Please install the Rust version, a drop-in replacement with
  the same command line and output:

      sudo snap remove goteira-shell
      sudo snap install goteira

  More information: https://github.com/ayubio/goteira

grade: stable
confinement: strict

parts:
  scripts:
    plugin: dump
    source: .
    organize:
      goteira.sh: bin/goteira.sh
    stage-packages:
      - iputils-ping
      - mtr-tiny
      - coreutils
      - grep
      - sed
      - gawk

apps:
  goteira-shell:
    command: bin/goteira.sh
    plugs:
      - network
      - network-bind
      - network-observe
